services:
  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NUXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    image: global-address-hub:latest
    container_name: global-address-hub
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NUXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

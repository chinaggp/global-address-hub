services:
  backend:
    build:
      context: ./backend/address-generator-api
    image: global-address-hub-backend:latest
    container_name: global-address-hub-backend
    environment:
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,https://globaladdresshub.com
      APP_RATE_LIMIT_RANDOM_ADDRESS_PER_MINUTE: 60
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE_URL: http://backend:8080
        NUXT_PUBLIC_SITE_URL: https://globaladdresshub.com
    image: global-address-hub-frontend:latest
    container_name: global-address-hub-frontend
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://backend:8080
      NUXT_PUBLIC_SITE_URL: https://globaladdresshub.com
    ports:
      - "3000:3000"
    depends_on:
      - backend

services:
  backend:
    build:
      context: ./backend/address-generator-api
    image: global-address-hub-backend:latest
    container_name: global-address-hub-backend
    restart: unless-stopped
    environment:
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      APP_RATE_LIMIT_RANDOM_ADDRESS_PER_MINUTE: ${APP_RATE_LIMIT_RANDOM_ADDRESS_PER_MINUTE:-1000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NUXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    image: global-address-hub-frontend:latest
    container_name: global-address-hub-frontend
    restart: unless-stopped
    environment:
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NUXT_PUBLIC_GOOGLE_ANALYTICS_ID: ${NUXT_PUBLIC_GOOGLE_ANALYTICS_ID:-}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
